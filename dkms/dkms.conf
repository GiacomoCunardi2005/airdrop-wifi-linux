# Patched iwlwifi (Wi-Fi + AirDrop insieme), rebuilt by DKMS for every installed kernel.
# Source: drivers/net/wireless/intel/iwlwifi of Linux 7.3 with patches/iwlwifi-awdl-coex-7.3.patch.
# iwlwifi and iwlmvm only: DKMS keeps the stock iwlmld/iwldvm, which this card (iwlmvm) never loads.
PACKAGE_NAME="iwlwifi-awdl-coex"
PACKAGE_VERSION="7.3"
# The CachyOS kernel is built with clang.
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build LLVM=1 modules"
BUILT_MODULE_NAME[0]="iwlwifi"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="iwlmvm"
BUILT_MODULE_LOCATION[1]="mvm/"
DEST_MODULE_LOCATION[1]="/updates/dkms"
AUTOINSTALL="yes"
# The patch is written against 7.3: on a newer series DKMS skips it and the stock driver loads
# (the tray falls back to exclusive AirDrop) until the patch is ported.
BUILD_EXCLUSIVE_KERNEL="^7\.3\."
